name: Functional tests using Ragger and latest speculos

on:
  workflow_call:
    inputs:
      app_repository:
        required: false
        default: ${{ github.repository }}
        type: string
      app_branch_name:
        required: false
        default: ${{ github.ref }}
        type: string
      artifact_prefix:
        description: Prefix of the branch name in artifact names, keeping them unique when several callers test the same branch
        required: false
        default: ''
        type: string
      run_for_devices:
        description: JSON list of devices to test (defaults to the devices of the app manifest)
        required: false
        default: 'None'
        type: string
      test_filter:
        description: Pytest '-k' expression selecting the tests to run
        required: false
        default: ''
        type: string
      swap:
        description: Run the app swap tests, with Exchange as main app and Ethereum as library
        required: false
        default: false
        type: boolean

env:
  ARTIFACT_ID: ${{ inputs.artifact_prefix }}${{ inputs.app_branch_name }}

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_branch_name }}
      upload_app_binaries_artifact: compiled_app_binaries-${{ inputs.artifact_prefix }}${{ inputs.app_branch_name }}
      run_for_devices: ${{ inputs.run_for_devices }}
      builder: ledger-app-builder

  build_exchange:
    name: Build Exchange using the reusable workflow
    if: ${{ inputs.swap }}
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      app_repository: LedgerHQ/app-exchange
      app_branch_name: master
      use_case: use_test_keys
      upload_app_binaries_artifact: exchange_binaries-${{ inputs.artifact_prefix }}${{ inputs.app_branch_name }}
      run_for_devices: ${{ inputs.run_for_devices }}
      builder: ledger-app-builder

  build_docker_image:
    name: Build Speculos Docker image
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: actions/checkout@v7
      with:
          submodules: recursive
          fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the Speculos docker
      uses: docker/build-push-action@v6
      with:
        push: false
        tags: ledgerhq/speculos:test
        context: .
        file: ./Dockerfiles/Dockerfile
        outputs: type=docker,dest=/tmp/speculos_image.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: speculos_image-${{ env.ARTIFACT_ID }}
        path: /tmp/speculos_image.tar

  call_get_app_metadata:
    name: Retrieve application metadata
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/_get_app_metadata.yml@v1
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_branch_name }}
      compatible_devices: ${{ inputs.run_for_devices }}

  ragger_tests:
    name: Functional tests with Ragger
    runs-on: ubuntu-latest
    needs: [build_docker_image, build_application, build_exchange, call_get_app_metadata]
    # build_exchange is skipped when inputs.swap is false
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.call_get_app_metadata.outputs.compatible_devices) }}

    steps:
    - name: Clone
      uses: actions/checkout@v7
      with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch_name }}
          path: app
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

    - name: Prepare test conditions
      shell: bash
      env:
        INPUT_SWAP: ${{ inputs.swap }}
        INPUT_TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        pip install ledgered

        # Get Test directory from manifest: the 'swap' one in swap mode, else the default one
        if [ "${INPUT_SWAP}" == "true" ]; then
          TEST_DIR=$(ledger-manifest --output-pytest-directories -j -- "./app/ledger_app.toml" | jq -r '.pytest_directories[] | select(.name == "swap") | .directory')
        else
          TEST_DIR=$(ledger-manifest -otp "./app/ledger_app.toml")
        fi
        if [ -z "${TEST_DIR}" ]; then
          echo "No test directory found" && exit 1
        fi
        echo "TEST_DIR=${TEST_DIR}" >> "$GITHUB_ENV"

        # Get SDK from manifest
        SDK=$(ledger-manifest -os "./app/ledger_app.toml")
        if [ -z "${SDK}" ]; then
          echo "No sdk defined" && exit 1
        fi
        echo "SDK=${SDK,,}" >> "$GITHUB_ENV"

        # Rust apps skip test_version unless a filter is given
        if [ -n "${INPUT_TEST_FILTER}" ]; then
          TEST_FILTER="${INPUT_TEST_FILTER}"
        elif [ "${SDK,,}" == "rust" ]; then
          TEST_FILTER="not test_version"
        fi
        echo "TEST_FILTER=${TEST_FILTER}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Download artifact
      uses: actions/download-artifact@v7
      with:
        name: speculos_image-${{ env.ARTIFACT_ID }}
        path: /tmp

    - name: Load image
      run: |
        docker load --input /tmp/speculos_image.tar
        docker image ls -a

    - name: Download app binaries
      uses: actions/download-artifact@v7
      with:
        name: compiled_app_binaries-${{ env.ARTIFACT_ID }}
        path: ${{ github.workspace }}/app/${{ env.SDK == 'c' && 'build' || 'target' }}

    - name: Download Exchange binaries
      if: ${{ inputs.swap }}
      uses: actions/download-artifact@v7
      with:
        name: exchange_binaries-${{ env.ARTIFACT_ID }}
        path: ${{ github.workspace }}/app/${{ env.TEST_DIR }}/.test_dependencies/main/app-exchange/build

    - name: Download latest Ethereum release
      if: ${{ inputs.swap }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEVICE: ${{ matrix.device }}
      run: |
        # Release assets and C build directories name the Nano S+ 'nanos2'
        BUILD_DEVICE="${DEVICE/nanosp/nanos2}"
        ETH_DIR="app/${TEST_DIR}/.test_dependencies/libraries/app-ethereum/build/${BUILD_DEVICE}/bin"
        mkdir -p "${ETH_DIR}"
        gh release download -R LedgerHQ/app-ethereum -p "app-*-${BUILD_DEVICE}.elf" -O "${ETH_DIR}/app.elf"

    - name: Run and test Speculos docker for C apps
      if: ${{ env.SDK == 'c' }}
      run: |
          docker run --rm \
          --entrypoint /bin/bash \
          -v "${{ github.workspace }}/app:/app" \
          ledgerhq/speculos:test \
          -c "apt-get update && apt-get install -y gcc && \
              pip install -r /app/${{ env.TEST_DIR }}/requirements.txt && \
              pytest /app/${{ env.TEST_DIR }}/ --tb=short -v --device ${{ matrix.device }} ${TEST_FILTER:+-k '$TEST_FILTER'}"

    - name: Run and test Speculos docker for Rust apps
      if: ${{ env.SDK == 'rust' }}
      run: |
          docker run --rm \
          --entrypoint /bin/bash \
          -v "${{ github.workspace }}/app:/app" \
          ledgerhq/speculos:test \
          -c "
            apt-get update && \
            apt-get install -y gcc cargo && \
            pip install -r /app/${{ env.TEST_DIR }}/requirements.txt && \
            pytest /app/${{ env.TEST_DIR }}/ --tb=short -v --device ${{ matrix.device }} ${TEST_FILTER:+-k '$TEST_FILTER'}
          "
