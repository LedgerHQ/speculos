    <script>
"use strict";

// Whether the emulated device uses a touchscreen instead of physical buttons.
var g_touch_device = false;

function post_request(url, data, callback) {
  var http = new XMLHttpRequest();
  http.open("POST", url, true);
  http.setRequestHeader("Content-type", "application/json");
  http.onreadystatechange = function() {
    if (http.readyState == 4 && http.status == 200 && callback !== null) {
      callback(http);
    }
  }
  http.send(JSON.stringify(data));
}

function get_request(url, callback) {
  var http = new XMLHttpRequest();
  http.open("GET", url, true);
  http.onreadystatechange = function() {
    if (http.readyState == 4 && http.status == 200) {
      callback(http);
    }
  }
  http.send();
}

function click_button(button) {
  post_request("/button/" + button, {"action": "press-and-release"}, null);
}

function add_apdu(data, received) {
  var element = document.getElementById("apdus");
  element.value += (received ? "<" : ">") + " " + data + "\n";
  element.scrollTop = element.scrollHeight;
}

function send_apdu() {
  var element = document.getElementById("apdu");
  var apdu = element.value.replace(" ", "");
  if (apdu == "") {
    return;
  }
  add_apdu(apdu, true);
  post_request("/apdu", {"data": apdu}, function (http) {
    var data = JSON.parse(http.responseText)["data"];
    add_apdu(data, false);
  });
  // Clear the command which was sent, to prevent from accidentally sending it twice.
  // Users who want to send the same command several times can copy it again from the "APDUs" text area.
  element.value = "";
}

function refresh_screen() {
  var element = document.getElementById("screenshot");
  /*
   * A new event might be received while the current request to /screenshot
   * isn't finished. The browser doesn't make a new request and the resulting
   * screenshot is outdated. Appending Date.now() forces the browser to cancel
   * the current request and make a new one.
   */
  element.src = "/screenshot?force=" + Date.now();
}

function stream_events() {
  var source = new EventSource('/events?stream=true');
  var element = document.getElementById("events");
  source.onmessage = function (event) {
    refresh_screen();
    element.value += event.data + "\n";
    element.scrollTop = element.scrollHeight;
  };
}

function on_keydown(e) {
  e = e || window.event;
  if (document.activeElement.id == "apdu") {
    if (e.code == "Enter" || e.keyCode == 13) {
      send_apdu();
    }
  } else {
    if (e.code == "KeyD" || e.keyCode == 68) {
      document.body.classList.toggle("dark-mode");
    } else if (!g_touch_device) {
      // Only send buttons when the APDU input does not have the focus
      if (e.code == "ArrowDown" || e.keyCode == 40) {
        click_button("both");
      } else if (e.code == "ArrowLeft" || e.keyCode == 37) {
        click_button("left");
      } else if (e.code == "ArrowRight" || e.keyCode == 39) {
        click_button("right");
      }
    }
  }
}

function zoom_screenshot() {
  var element = document.getElementById("screenshot");
  element.addEventListener("load", function () {
    // The 2x zoom suits the small Nano screens; the larger touchscreen
    // models (400x672 and up) are displayed at natural size.
    var zoom = (element.naturalWidth <= 200) ? 2 : 1;
    element.width = element.naturalWidth * zoom;
    element.height = element.naturalHeight * zoom;
  });
}

/*
 * Touchscreen support (Stax, Flex, Apex): forward clicks on the screenshot to
 * the /finger endpoint. A click is a tap, a held click is a long press, and a
 * drag is a swipe (press at the start position, release at the end position).
 */
function setup_touch(screen_width, screen_height) {
  var element = document.getElementById("screenshot");
  var start = null;
  var poll_timer = null;

  g_touch_device = true;

  // The screen can change without any text event (switches, refresh after the
  // events): reload it periodically, one pending reload at a time.
  var POLL_INTERVAL_MS = 300;
  function schedule_refresh() {
    clearTimeout(poll_timer);
    poll_timer = setTimeout(refresh_screen, POLL_INTERVAL_MS);
  }
  element.addEventListener("load", schedule_refresh);
  element.addEventListener("error", schedule_refresh);
  schedule_refresh();

  // A tap and a very short drag should be equivalent: below this distance
  // (in screen pixels), the gesture is sent as a single-position touch.
  var SWIPE_THRESHOLD = 5;

  // Map a pointer position to screen pixels, relative to the image content box (without its padding).
  function to_screen_coords(event) {
    var rect = element.getBoundingClientRect();
    var style = window.getComputedStyle(element);
    var pad_left = parseFloat(style.paddingLeft), pad_top = parseFloat(style.paddingTop);
    var width = element.clientWidth - pad_left - parseFloat(style.paddingRight);
    var height = element.clientHeight - pad_top - parseFloat(style.paddingBottom);
    var x = Math.floor((event.clientX - rect.left - element.clientLeft - pad_left) * screen_width / width);
    var y = Math.floor((event.clientY - rect.top - element.clientTop - pad_top) * screen_height / height);
    x = Math.min(Math.max(x, 0), screen_width - 1);
    y = Math.min(Math.max(y, 0), screen_height - 1);
    return [x, y];
  }

  // Replace the physical buttons: touch devices have none.
  var buttons = document.getElementsByClassName("buttons")[0];
  buttons.textContent = "click = tap, hold = long press, drag = swipe";
  buttons.className += " touch-hint";
  element.style.cursor = "pointer";
  // Keep the browser from scrolling or dragging the image during a swipe.
  element.style.touchAction = "none";
  element.ondragstart = function (e) { e.preventDefault(); };

  // Send /finger requests one at a time, so that a release never overtakes its press.
  var finger_queue = [];
  function send_finger(data) {
    finger_queue.push(data);
    if (finger_queue.length == 1) {
      send_next_finger();
    }
  }
  function send_next_finger() {
    var http = new XMLHttpRequest();
    http.open("POST", "/finger", true);
    http.setRequestHeader("Content-type", "application/json");
    http.onloadend = function () {
      finger_queue.shift();
      if (finger_queue.length > 0) {
        send_next_finger();
      }
    };
    http.send(JSON.stringify(finger_queue[0]));
  }

  // Pointer events cover mouse, finger and pen; the capture keeps the release on the image.
  // The press is sent on pointerdown and the release on pointerup, so holding the pointer holds the finger.
  element.addEventListener("pointerdown", function (e) {
    if (start === null && e.isPrimary && e.button == 0) {
      start = to_screen_coords(e);
      element.setPointerCapture(e.pointerId);
      send_finger({"action": "press", "x": start[0], "y": start[1]});
    }
  });
  function release(e) {
    if (start === null || !e.isPrimary) {
      return;
    }
    // A cancelled pointer has no meaningful position: release where it was pressed.
    var end = e.type == "pointercancel" ? start : to_screen_coords(e);
    // Below the threshold, release at the press position: a tap, not a tiny swipe.
    if (Math.abs(end[0] - start[0]) <= SWIPE_THRESHOLD && Math.abs(end[1] - start[1]) <= SWIPE_THRESHOLD) {
      end = start;
    }
    start = null;
    send_finger({"action": "release", "x": end[0], "y": end[1]});
  }
  element.addEventListener("pointerup", release);
  element.addEventListener("pointercancel", release);
}

function main() {
  zoom_screenshot();
  refresh_screen();
  stream_events();
  document.onkeydown = on_keydown;
  get_request("/model", function (http) {
    var model = JSON.parse(http.responseText);
    // Every non-Nano model is a touchscreen without physical buttons.
    if (model["name"].indexOf("nano") == -1) {
      setup_touch(model["screen"]["width"], model["screen"]["height"]);
    }
  });
}
    </script>
  </head>
  <body onLoad="main();">
    <div class="main">
      <div class="device">
        <div class="container-device">
          <div>
            <img src="/screenshot" id="screenshot" class="screenshot" alt="Device screen" title="Device screen" />
          </div>
          <div class="buttons">
            <button type="button" class="button-device" onClick="click_button('left');" title="Press the left button (&larr;)">&lt;&nbsp;left</button>
            <button type="button" class="button-device" onClick="click_button('both');" title="Press both buttons (&darr;)">both</button>
            <button type="button" class="button-device" onClick="click_button('right');" title="Press the right button (&rarr;)">right&nbsp;&gt;</button>
          </div>
        </div>
      </div>
      <div class="infos">
        <div class="container-textarea">
          <div class="send-apdu">
            <div class="input-apdu-container">
              <input type="text" class="input-apdu" placeholder="APDU (in hexadecimal)" id="apdu" title="Input data sent to the application" />
            </div>
            <div class="button-apdu">
              <button type="button" class="button-send" onClick="send_apdu();">send</button>
            </div>
          </div>
          <div>
            <textarea id="apdus" readonly rows="20" cols="50" title="Data exchanged with the application"></textarea>
            <p>APDUs</p>
          </div>
        </div>
        <div class="container-textarea">
          <textarea id="events" readonly rows="20" cols="50" title="Events received from the virtual device"></textarea>
          <p>Events</p>
        </div>
      </div>
      <div class="footer">
        <p>
Speculos (<a href="https://ledgerhq.github.io/speculos">documentation</a>, <a href="/swagger/">API</a>) is open source, please contribute on <a href="https://github.com/LedgerHQ/speculos">GitHub</a>.
        </p>
      </div>
    </div>
